# CI gate for llama-orchestrator (R4/F13, plan T0.4).
#
# - `gate-311` runs on Python 3.11 (the declared floor) in an environment with NO
#   binaries installed under bins/ — the suite must be hermetic (R8).
# - `gate-312` proves the Python >= 3.12 branch of the tarfile version gate (R6,
#   Decision 6: added once F2's version gate is in).
# - While `mypy-baseline.txt` exists at the repo root (Phases 0–3), lint gates
#   allow only findings already listed there; no NEW finding may appear. Once the
#   baseline file is deleted (Phase 4, T4.3) both tools must be fully clean.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate-311:
    name: Gate — Python 3.11 (no binaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: requirements.txt has no editable self-install (R3)
        run: |
          if grep -nE '^-e( |$)' requirements.txt; then
            echo "::error::requirements.txt must not contain editable (-e) lines (F11/R3)"
            exit 1
          fi

      - name: Lint gate (ruff + mypy strict, baseline-aware)
        run: |
          set -u
          if [ ! -f mypy-baseline.txt ]; then
            # No baseline → both gates must be fully clean.
            ruff check .
            mypy --strict src/llama_orchestrator
            exit 0
          fi
          # Baseline present: collect current findings normalized to file:CODE.
          {
            ruff check . --output-format concise 2>&1 || true
            mypy --strict src/llama_orchestrator 2>&1 || true
          } | sed 's/\x1b\[[0-9;]*m//g' > /tmp/lint-now-raw.txt
          # ruff concise: path:line:col: CODE ...   → file:CODE
          grep -E '^[^ :]+:[0-9]+:[0-9]+: [A-Z]+[0-9]+' /tmp/lint-now-raw.txt \
            | awk -F': ' '{split($1, p, ":"); print p[1] ":" $2}' \
            | awk '{print $1 " " $2}' > /tmp/lint-now.txt || true
          # mypy: path:line: error: ... [code]    → file:code
          # Only lines carrying a bracketed code are compared, so the baseline is
          # line-number independent (bare `note:` follow-ups carry no code).
          grep -E '^[^ :]+:[0-9]+: (error|note):.*\[[A-Za-z0-9-]+\]' /tmp/lint-now-raw.txt \
            | sed -E 's/^([^:]+):[0-9]+: (error|note):.*\[([A-Za-z0-9-]+)\].*/\1:\3/' >> /tmp/lint-now.txt || true
          sort -u /tmp/lint-now.txt > /tmp/lint-now-sorted.txt
          grep -vE '^(#|$)' mypy-baseline.txt | sed 's/^[[:space:]]*//' | sort -u > /tmp/lint-base-sorted.txt
          NEW=$(comm -23 /tmp/lint-now-sorted.txt /tmp/lint-base-sorted.txt)
          if [ -n "$NEW" ]; then
            echo "::error::New lint findings vs mypy-baseline.txt:"
            echo "$NEW"
            exit 1
          fi
          echo "OK: no new lint findings vs mypy-baseline.txt"

      - name: Test gate (hermetic — no bins/, no GPU, no network)
        run: |
          python -m pytest -q

  gate-312:
    name: Gate — Python 3.12 (tarfile version-gate branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Test gate (proves the >= 3.12 branch of extract_tar_gz, R6)
        run: |
          python -m pytest -q
