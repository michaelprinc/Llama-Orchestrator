[project]
name = "llama-orchestrator"
version = "2.2.0"
description = "Docker-like CLI orchestration for llama.cpp server instances"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "MichaelPrinc" }
]
keywords = ["llama.cpp", "llm", "orchestration", "cli", "inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.5",
    # R2/F10: the `[all]` extra no longer exists in modern typer (verified warning on
    # 0.27.2); plain `typer` provides everything this project imports.
    "typer>=0.9",
    "rich>=13.7",
    "httpx>=0.25",
    "psutil>=5.9",
    "aiosqlite>=0.19",
    "huggingface_hub>=0.32",
    "keyring>=25.6",
]

[project.optional-dependencies]
# R1/F9: the PEP 735 `[dependency-groups].dev` table below is the SINGLE source of
# truth for dev tooling. This extra is a thin alias kept with IDENTICAL pins so
# `pip install -e .[dev]` and `uv sync` resolve to the same environments (decision
# recorded in .agent/QUALITY_STATE.md and the implementation report).
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.11",
    "mypy>=1.14",
    "types-psutil>=7.2",
]

[project.scripts]
llama-orch = "llama_orchestrator.cli:app"

[project.urls]
Repository = "https://github.com/MichaelPrinc/llama-orchestrator"
Documentation = "https://github.com/MichaelPrinc/llama-orchestrator#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llama_orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Only lint project code: `tmp/` holds analysis artifacts and `external/` holds
# vendored third-party trees (R22 scope; CI runs the same config).
extend-exclude = ["tmp", "external"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["llama_orchestrator"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=llama_orchestrator --cov-report=term-missing"

[tool.coverage.run]
source = ["src/llama_orchestrator"]
branch = true

[dependency-groups]
# R1/F9: single source of truth for dev tooling (uv-native). The
# `[project.optional-dependencies].dev` alias above must stay identical to this.
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.11",
    "mypy>=1.14",
    "types-psutil>=7.2",
]
